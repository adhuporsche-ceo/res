<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application Review | Student Profiling System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-wrapper">
    <main id="main-content">
      <div class="page-container">
        <div class="page-header">
          <div>
            <h3 class="page-title">Student Application Review</h3>
            <p class="page-subtitle">Review submissions before adding them to the student directory.</p>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary" id="refreshApplications" type="button" aria-label="Refresh applications" title="Refresh"><i class="bi bi-arrow-clockwise"></i></button>
            <a href="add-student.html" class="btn btn-primary"><i class="bi bi-person-plus-fill me-1"></i> New Application</a>
          </div>
        </div>

        <div class="d-flex align-items-center gap-2 mb-3">
          <label class="small text-muted" for="applicationStatus">Status</label>
          <select class="form-select form-select-sm" id="applicationStatus" style="width: 180px">
            <option value="PENDING">Pending</option>
            <option value="APPROVED">Approved</option>
            <option value="REJECTED">Rejected</option>
          </select>
          <span class="small text-muted ms-auto" id="applicationCount"></span>
        </div>

        <div id="applicationMessage" class="alert d-none" role="status"></div>
        <div class="table-responsive">
          <table class="table align-middle">
            <thead>
              <tr>
                <th scope="col">Register number</th>
                <th scope="col">Student</th>
                <th scope="col">Department</th>
                <th scope="col">Submitted</th>
                <th scope="col">Application</th>
                <th scope="col" class="text-end">Review</th>
              </tr>
            </thead>
            <tbody id="applicationsTableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/student-applications.js"></script>
</body>
</html>
